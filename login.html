<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สถานกีฬาและสุขภาพ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Sarabun', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 80px;
            margin-bottom: 20px;
        }
        .login-title {
            font-size: 1.5rem;
            color: #e96b04;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Sarabun', sans-serif;
            box-sizing: border-box; /* สำคัญ: ไม่ให้กล่องล้น */
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #e96b04;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #d35400;
        }
        .forgot-pass {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
            text-align: right;
        }
        .register-link {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }
        .register-link a {
            color: #e96b04;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCdqxqHDF1kx1eauj5CMjXzOvya_PL9b1s",
            authDomain: "html-80dea.firebaseapp.com",
            databaseURL: "https://html-80dea-default-rtdb.firebaseio.com",
            projectId: "html-80dea",
            storageBucket: "html-80dea.firebasestorage.app",
            messagingSenderId: "539935314409",
            appId: "1:539935314409:web:8a04fec151113e372d3b78",
            measurementId: "G-W9WT2NWDPB"
        };

        // เริ่มต้นทำงาน Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        // สร้างตัวแปร database ไว้ใช้งานทั่วทั้งเว็บ
        const db = firebase.database();
    </script>
    
</head>
<body>

    <div class="login-card">
        <img src="sutlogo.png" alt="Logo" class="login-logo" onerror="this.src='https://via.placeholder.com/80x80?text=Logo'">
        <div class="login-title">เข้าสู่ระบบ</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>ชื่อผู้ใช้งาน (กรอกเป็นรหัสนักศึกษา เช่น B6xxxxxx)</label>
                <input type="text" id="username" placeholder="sutgym" required>
            </div>
            <div class="input-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="password" placeholder="...." required>
            </div>
            
            <div class="forgot-pass"><a href="forgot.html">ลืมรหัสผ่าน?</a></div>

            <button type="submit" class="btn-login" style="margin-top: 20px;">เข้าใช้งาน</button>
        </form>

        <div class="register-link">
    ยังไม่มีบัญชีผู้ใช้ไหม? <a href="register.html">สมัครสมาชิก</a>
</div>
    </div>

   <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim().toUpperCase();
            const password = document.getElementById('password').value.trim();
            
            if(username) {
                // 🔥 ไปเช็คข้อมูลที่ Firebase (Cloud)
                db.ref('users/' + username).once('value').then((snapshot) => {
                    const userData = snapshot.val();

                    if (userData) {
                        // เจอ User -> เช็ครหัสผ่าน
                        if (userData.password === password) {
                            // รหัสถูก -> บันทึก Session ในเครื่องเพื่อให้รู้ว่าล็อกอินแล้ว
                            sessionStorage.setItem('currentUser', JSON.stringify(userData));
                            alert("เข้าสู่ระบบสำเร็จ (Online)!");
                            window.location.href = 'index.html';
                        } else {
                            alert("รหัสผ่านไม่ถูกต้อง!");
                        }
                    } else {
                        alert("ไม่พบผู้ใช้งานนี้ในระบบ");
                    }
                }).catch((err) => {
                    alert("การเชื่อมต่อมีปัญหา: " + err.message);
                });
            } else {
                alert("กรุณากรอกชื่อผู้ใช้งาน");
            }
        }
    </script>

</body>
</html>
